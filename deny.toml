# Trimmed from the OxiBelt `deny.toml`: same advisory, source and license
# policy, with the ban list reduced to this workspace's dependencies.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
maximum-db-staleness = "P7D"
unused-ignored-advisory = "deny"
ignore = []

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
deny = [
  { crate = "rustix", deny-multiple-versions = true, reason = "Keep the reviewed syscall boundary on one line" },
  { crate = "mimalloc", deny-multiple-versions = true, reason = "Keep the benchmark baseline on the allocator OxiBelt ships" },
]

[bans.workspace-dependencies]
duplicates = "warn"
include-path-dependencies = true
unused = "deny"

[licenses]
confidence-threshold = 0.93
include-dev = true
include-build = true
unused-allowed-license = "allow"
unused-license-exception = "deny"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"
