[package]
name = "allocatbelt-sys"
description = "The unsafe boundary of allocatbelt: address-space reservation, commit/purge syscalls and metadata slabs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-only (the crate itself rejects other targets; see `src/platform.rs`).
# Only for what rustix does not cover: guard-marker `madvise` advice,
# `pthread_atfork` and `sched_setscheduler`.
libc.workspace = true
rustix.workspace = true

