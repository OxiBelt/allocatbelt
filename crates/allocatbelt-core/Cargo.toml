[package]
name = "allocatbelt-core"
description = "Safe-Rust allocation logic for allocatbelt: size classes, bitmaps and page/segment bookkeeping over offsets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `model`: the checking mock `Os` and the program interpreter that the unit
# tests and the fuzz target (`fuzz/`) share. Pulls in `std`.
model = []

[dev-dependencies]
proptest.workspace = true
# The futex and CPU clock of the lock benchmark (`lock::tests`).
rustix = { workspace = true, features = ["time"] }

# Model checker for the atomic protocols in `proto.rs`, only under
# `RUSTFLAGS="--cfg loom"`. Declared here rather than in
# `[workspace.dependencies]`: cargo-deny resolves the graph without
# `--cfg loom` and would reject it there as an unused workspace dependency.
[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[lints]
workspace = true
