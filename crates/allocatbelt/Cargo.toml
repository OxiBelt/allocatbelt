[package]
name = "allocatbelt"
description = "A Rust global allocator whose allocation logic is safe Rust; unsafe is confined to allocatbelt-sys and this adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Unconditional, so that a build for an unsupported platform reaches the
# platform gates in allocatbelt-sys instead of producing an empty crate.
[dependencies]
allocatbelt-arch.workspace = true
allocatbelt-core.workspace = true
allocatbelt-sys.workspace = true

[dev-dependencies]
libc.workspace = true

[lints]
workspace = true
