name: Check allocatbelt

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  rust-checks:
    name: Rust checks (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.98.1
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust_version }}

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo test
        run: cargo test --release --all-features --locked

      # Checks that every detected SIMD candidate runs on this runner's CPU
      # (AVX2/AVX-512 on x86_64, NEON/SVE on the arm runner).
      # Hosted-runner timings are not evidence (docs/research/simd-benchmarks.md).
      - name: SIMD benchmark smoke run
        run: cargo run --release --locked -p allocatbelt-simd-bench --bin bench-simd -- --quick

      # Reports the runner's kernel, whether the maintenance thread's
      # io_uring (and Linux 7.0's SQ_REWIND) can be set up there, and batched
      # purges against one madvise per run (docs/research/benchmarks.md).
      # Informational: hosted-runner timings are not evidence.
      - name: io_uring purge ring report
        run: |
          uname -r
          cargo test --release --locked -p allocatbelt --features io-uring --lib ring_benchmark -- --ignored --nocapture

  # The platform contract (docs/platform.md): x86_64 builds need x86-64-v3,
  # and unsupported architectures, ABIs, byte orders and operating systems
  # fail at compile time with the gates' own messages.
  platform-gates:
    name: Platform gates (x86-64-v3 floor, unsupported targets rejected)
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain and targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            riscv64gc-unknown-linux-gnu \
            i686-unknown-linux-gnu \
            armv7-unknown-linux-gnueabihf \
            x86_64-unknown-linux-gnux32 \
            riscv32imac-unknown-none-elf \
            wasm32-unknown-unknown \
            powerpc64le-unknown-linux-gnu \
            loongarch64-unknown-linux-gnu \
            s390x-unknown-linux-gnu \
            x86_64-unknown-freebsd

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      - name: Check the platform gates
        run: scripts/check-platform-gates.sh

  # Single-package directive §3.7: `allocatbelt` is the one published
  # package. It must package and pass `cargo publish --dry-run`, and a
  # consumer outside this repository must build it (and, on x86_64, stop at
  # the gate without x86-64-v3).
  package:
    name: crates.io package (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      - name: Package, dry-run publish and build a consumer
        run: scripts/check-package.sh

  # Directive Phase C: every supported combination of allocatbelt's Cargo
  # features builds without warnings and passes its tests on stable
  # (docs/features.md).
  features:
    name: Feature combinations (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup component add clippy --toolchain 1.98.1

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      - name: Clippy and tests per feature combination
        run: scripts/check-features.sh

  # Directive Phase E: a hardened container (no capabilities, read-only,
  # no-new-privileges, Docker's default seccomp) runs every test; seccomp
  # profiles deny or allow io_uring and sched_setscheduler to check the
  # fallbacks and `Require` errors; qemu-user CPU models check that only
  # the ISA visible to the process is detected. The runner is itself a VM,
  # so this is Docker in a VM (docs/sandbox.md).
  sandbox:
    name: Sandbox and virtualization (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target "$(uname -m)-unknown-linux-musl"
          rustup default 1.98.1

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          docker version --format '{{.Server.Version}}'
          uname -r

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      - name: Hardened container, fallbacks and visible ISA
        run: scripts/check-sandbox.sh

  # Single-package directive Phase F: the experimental SVE/SVE2 kernels,
  # checked against the portable loop and for their selection, natively and
  # under qemu CPU models and SVE vector lengths. Stable toolchain.
  experimental-sve:
    name: Experimental aarch64 SVE/SVE2 kernels
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          grep -m1 -o 'Features.*' /proc/cpuinfo || true

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      - name: Cargo clippy (SVE features)
        run: |
          cargo clippy -p allocatbelt --all-targets --locked --features experimental-aarch64-sve -- -D warnings
          cargo clippy -p allocatbelt --all-targets --locked --features experimental-aarch64-sve2 -- -D warnings

      - name: Kernels and selection under qemu CPU models
        run: scripts/check-experimental-isa.sh

  # Single-package directive Phase G: the experimental RVV kernel. The `v`
  # target feature is unstable in Rust 1.98, so this is the one job on a
  # (pinned) nightly; every other job stays on stable 1.98.1.
  experimental-rvv:
    name: Experimental riscv64 RVV kernel (nightly)
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the pinned nightly toolchain
        run: |
          rustup toolchain install nightly-2026-09-27 --profile minimal --component clippy \
            --target riscv64gc-unknown-linux-gnu

      - name: Install qemu-user, the riscv64 cross toolchain and llvm-objdump
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user gcc-riscv64-linux-gnu libc6-dev-riscv64-cross llvm
          qemu-riscv64 --version
          command -v llvm-objdump || sudo ln -s "$(ls /usr/bin/llvm-objdump-* | sort -V | tail -1)" /usr/local/bin/llvm-objdump

      - name: Fetch locked Cargo dependency graph
        run: cargo +nightly-2026-09-27 fetch --locked

      - name: Lint, isolation and kernel checks under qemu
        run: scripts/check-experimental-rvv.sh

  # Plan phase 3: the bit scans lower to tzcnt/popcnt/lzcnt on x86-64-v3
  # and to ctz/cpop/clz on riscv64 with Zbb (assembly only, no qemu).
  scalar-isa:
    name: Scalar ISA lowering (x86-64-v3, riscv64 + Zbb)
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target riscv64gc-unknown-linux-gnu
          rustup default 1.98.1

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      - name: Check the generated bit instructions
        run: scripts/check-scalar-isa.sh

  riscv64-qemu-tests:
    name: riscv64 tests under qemu-user (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rv64gc
            rustflags: ""
          - name: rv64gc + Zbb
            rustflags: "-C target-feature=+zbb"
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target riscv64gc-unknown-linux-gnu
          rustup default 1.98.1

      # qemu-user 8.2 intermittently crashes with "QEMU internal SIGSEGV" on
      # the multithreaded tests; 10.2.1 is the oldest release verified clean.
      - name: Install qemu-user and the riscv64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
          qemu_version="$(dpkg-query -W -f='${Version}' qemu-user)"
          qemu-riscv64 --version
          dpkg --compare-versions "${qemu_version}" ge "1:10.2.1" \
            || { echo "qemu-user ${qemu_version} is older than 10.2.1" >&2; exit 1; }

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      # The runner in `.cargo/config.toml` uses `-cpu max`: Zbb for the +zbb
      # build, and RVA23 for Ubuntu 26.04's riscv64 cross glibc. With
      # `io-uring`, whose fallback qemu-user's ENOSYS exercises.
      - name: Cargo test
        run: cargo test --release --locked --target riscv64gc-unknown-linux-gnu -p allocatbelt -p allocatbelt-core-check -p allocatbelt-simd-bench --features allocatbelt/io-uring

      # The experimental RVV candidates: the auto-vectorized kernels built
      # with V (an unstable target feature, hence rustc's warning).
      - name: Cargo test (SIMD candidates with V)
        env:
          RUSTFLAGS: ${{ matrix.rustflags }} -C target-feature=+v
        run: cargo test --release --locked --target riscv64gc-unknown-linux-gnu -p allocatbelt-simd-bench

  loom-models:
    name: loom models of the core's atomic protocols
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg loom

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Fetch locked Cargo dependency graph
        run: cargo fetch --locked

      - name: Cargo test (loom)
        run: cargo test --release --locked -p allocatbelt-core-check --lib loom

  fuzz:
    name: Fuzz the heap model (cargo-fuzz, 10 minutes)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchains and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-09-28 --profile minimal
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz heap_ops
        working-directory: fuzz
        run: cargo +nightly-2026-09-28 fuzz run heap_ops -- -max_total_time=600 -rss_limit_mb=4096 -max_len=4096

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: allocatbelt-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/artifacts
          if-no-files-found: warn
          retention-days: 30

  rust-advisory-checks:
    name: Rust dependency admission
    runs-on: ubuntu-26.04
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install pinned Rust dependency tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny complete policy
        run: cargo deny check

  mutation-testing:
    name: Core mutation testing (mewt 4.0.0)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install pinned mewt
        run: |
          cargo +1.98.1 install mewt --version 4.0.0 --locked
          test "$(mewt --version)" = "mewt 4.0.0"

      - name: Run mutation campaign
        run: scripts/run-mutation-testing.sh

      - name: Upload mutation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: allocatbelt-mutation-testing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/allocatbelt-mutation-testing
          if-no-files-found: warn
          retention-days: 30
