[workspace]
resolver = "3"
members = [
  "crates/allocatbelt-core",
  "crates/allocatbelt-sys",
  "crates/allocatbelt",
  "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
allocatbelt-core = { path = "crates/allocatbelt-core" }
allocatbelt-sys = { path = "crates/allocatbelt-sys" }
rustix = { version = "1.1.5", default-features = false, features = ["mm", "rand", "thread"] }

# Mirrors the OxiBelt workspace lint baseline so the crates can be dropped in unchanged.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.bench]
debug = true
