[workspace]
resolver = "3"
members = [
  "crates/allocatbelt-core",
  "crates/allocatbelt-sys",
  "crates/allocatbelt",
  "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
allocatbelt = { path = "crates/allocatbelt" }
allocatbelt-core = { path = "crates/allocatbelt-core" }
allocatbelt-sys = { path = "crates/allocatbelt-sys" }
# Model checker for `allocatbelt-core`'s atomic protocols, only under `--cfg loom`.
loom = "0.7.2"
# Baseline only: OxiBelt currently ships secure mimalloc on x86_64 Linux.
mimalloc = { version = "0.1.52", default-features = false, features = ["secure"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", default-features = false, features = ["mm", "rand", "thread"] }

# Mirrors the OxiBelt workspace lint baseline so the crates can be dropped in unchanged.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
# `--cfg loom` model-checks the atomic protocols of allocatbelt-core.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
manual_contains = "deny"
manual_find = "deny"
manual_is_ascii_check = "deny"
manual_memcpy = "deny"
manual_slice_fill = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_range_loop = "deny"
result_large_err = "allow"
undocumented_unsafe_blocks = "deny"

[profile.bench]
debug = true
